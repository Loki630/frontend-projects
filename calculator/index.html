<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calc-container">
        <div class="input-space">
            <form action="#" class="calc-form">
                <input type="text" class="exp-input">
                <output class = "calc-output">0</output>
            </form>
        </div>
        <div class="num-keys">
            <div class="del operation key">C</div>
            <div class="operation key">+</div>
            <div class="operation key">-</div>
            <div class="del operation key"><img src="./assets/backspace.png" alt=""></div>
            <div class="key">7</div>
            <div class="key">8</div>
            <div class="key">9</div>
            <div class="operation key">*</div>
            <div class="key">4</div>
            <div class="key">5</div>
            <div class="key">6</div>
            <div class="operation key">/</div>
            <div class="key">1</div>
            <div class="key">2</div>
            <div class="key">3</div>
            <div class="operation key">)</div>
            <div class="key">0</div>
            <div class="operation key">.</div>
            <div class="operation key">(</div>
            <div class="operation key">=</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
